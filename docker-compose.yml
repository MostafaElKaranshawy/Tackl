services:
  database:
    image: postgres:18
    container_name: tackl-db
    restart: unless-stopped
    secrets:
      - db_password
    environment:
      POSTGRES_DB: tackl
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - postgres_data:/var/lib/postgresql

  server:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: tackl-server
    restart: unless-stopped
    env_file:
      - ./Backend/.env
    environment:
      - PORT=4000
      - DB_HOST=tackl-db
      - NODE_ENV=production
    depends_on:
      - database
    ports:
      - "4000:4000"
    volumes:
      - ./Backend/logs:/app/logs

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:4000
    container_name: tackl-frontend
    restart: unless-stopped
    env_file:
      - ./Frontend/.env
    depends_on:
      - server
    ports:
      - "5173:80"

volumes:
  postgres_data:

secrets:
  db_password:
    file: ./secrets/db_password.txt
